<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semantic Cache Chat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.22);
    --text: #fafafa;
    --muted: #8f8f8f;
    --accent: #3291ff;
    --hit: #22c55e;
    --miss: #f59e0b;
    --error: #ef4444;
    --bubble-user: #141414;
    --bubble-assistant: rgba(255, 255, 255, 0.04);
    --radius: 10px;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
    mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
    z-index: 0;
    pointer-events: none;
  }
  #app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: calc(100% - 40px);
    max-width: 820px;
    height: calc(100vh - 40px);
    margin: 20px auto;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.015);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
  }
  header, #messages, form#composer {
    position: relative;
    z-index: 1;
  }
  header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #ffffff, #9c9c9c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin: 5px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    justify-content: flex-start;
  }
  .account-select {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .account-select label.text {
    font-size: 13px;
    color: var(--text);
  }
  .account-select select {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12.5px;
    font-family: var(--font-sans);
    cursor: pointer;
    outline: none;
  }
  .account-select select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(50, 145, 255, 0.18);
  }
  .cache-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .switch {
    position: relative;
    width: 38px;
    height: 22px;
    flex: none;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 2px;
    top: 2px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.15s ease;
  }
  .switch input:checked + .track {
    background: rgba(34, 197, 94, 0.35);
    border-color: rgba(34, 197, 94, 0.6);
  }
  .switch input:checked + .track::before {
    transform: translateX(16px);
  }
  .cache-toggle label.text {
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .cache-toggle .state {
    font-size: 11.5px;
    font-weight: 600;
    font-family: var(--font-mono);
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .cache-toggle .state.on { color: var(--hit); background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.3); }
  .cache-toggle .state.off { color: var(--miss); background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); }
  .session-id {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .session-id label.text {
    font-size: 13px;
    color: var(--text);
  }
  .session-id code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .session-id button {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 11.5px;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .session-id button:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--border-strong); }
  .session-id button:active { transform: scale(0.97); }
  .badge.bypass { background: rgba(239, 68, 68, 0.12); color: var(--error); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.error {
    border-color: var(--error);
    color: #ffb3b3;
  }
  .meta {
    margin-top: 6px;
    font-size: 11.5px;
    font-family: var(--font-mono);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 7px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 11px;
  }
  .badge.hit { background: rgba(34, 197, 94, 0.12); color: var(--hit); }
  .badge.miss { background: rgba(245, 158, 11, 0.12); color: var(--miss); }
  .badge.specific { background: rgba(50, 145, 255, 0.14); color: var(--accent); }
  .badge.general { background: rgba(168, 85, 247, 0.14); color: #c084fc; }
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #question {
    flex: 1;
    resize: none;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 11px 13px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #question:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(50, 145, 255, 0.18);
  }
  button#send {
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button#send:hover:not(:disabled) { background: #e2e2e2; }
  button#send:active:not(:disabled) { transform: scale(0.97); }
  button#send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💬 Semantic Cache Chat</h1>
    <p>Ask a question as one of several simulated bank customers — questions about your own account are cached per-customer, general questions are cached once and reused by everyone.</p>
    <div class="controls">
      <div class="account-select">
        <label class="text" for="accountSelect">Logged in as</label>
        <select id="accountSelect"></select>
      </div>
      <div class="cache-toggle">
        <label class="switch">
          <input type="checkbox" id="cacheToggle" checked />
          <span class="track"></span>
        </label>
        <label class="text" for="cacheToggle">Semantic cache</label>
        <span class="state on" id="cacheState">ON</span>
      </div>
      <div class="session-id">
        <label class="text">Session</label>
        <code id="sessionIdField"></code>
        <button type="button" id="newSessionBtn" title="Start a new session (new sessions/&lt;id&gt;.csv log)">New session</button>
      </div>
    </div>
  </header>
  <div id="messages"></div>
  <form id="composer" autocomplete="off">
    <textarea id="question" rows="1" placeholder="Ask something…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const cacheToggle = document.getElementById("cacheToggle");
  const cacheState = document.getElementById("cacheState");
  const accountSelect = document.getElementById("accountSelect");
  const sessionIdField = document.getElementById("sessionIdField");
  const newSessionBtn = document.getElementById("newSessionBtn");

  // One session_id per tab: generated on page load, kept for the tab's
  // lifetime via sessionStorage (a reload keeps it, a new tab gets a new one).
  // The server appends every /ask request's metrics to sessions/<id>.csv.
  const SESSION_ID_KEY = "chatSessionId";
  let sessionId = sessionStorage.getItem(SESSION_ID_KEY);
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem(SESSION_ID_KEY, sessionId);
  }
  sessionIdField.textContent = sessionId;

  function startNewSession() {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem(SESSION_ID_KEY, sessionId);
    sessionIdField.textContent = sessionId;
    messagesEl.innerHTML = "";
    input.focus();
  }
  newSessionBtn.addEventListener("click", startNewSession);

  const CACHE_PREF_KEY = "semanticCacheEnabled";
  const storedPref = localStorage.getItem(CACHE_PREF_KEY);
  cacheToggle.checked = storedPref === null ? true : storedPref === "true";

  function syncCacheState() {
    const enabled = cacheToggle.checked;
    cacheState.textContent = enabled ? "ON" : "OFF";
    cacheState.className = `state ${enabled ? "on" : "off"}`;
    localStorage.setItem(CACHE_PREF_KEY, String(enabled));
  }
  cacheToggle.addEventListener("change", syncCacheState);
  syncCacheState();

  const ACCOUNT_PREF_KEY = "selectedAccountId";

  async function loadAccounts() {
    try {
      const res = await fetch("/accounts");
      const accounts = await res.json();
      const storedAccountId = localStorage.getItem(ACCOUNT_PREF_KEY);

      accountSelect.innerHTML = "";
      for (const [accountId, info] of Object.entries(accounts)) {
        const option = document.createElement("option");
        option.value = accountId;
        option.textContent = `${info.customer_name} (${accountId}, ${info.account_type})`;
        accountSelect.appendChild(option);
      }
      if (storedAccountId && accounts[storedAccountId]) {
        accountSelect.value = storedAccountId;
      }
    } catch (err) {
      const option = document.createElement("option");
      option.textContent = "demo-001 (offline)";
      accountSelect.appendChild(option);
    }
  }
  accountSelect.addEventListener("change", () => {
    localStorage.setItem(ACCOUNT_PREF_KEY, accountSelect.value);
  });
  loadAccounts();

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text) {
    const row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector(".bubble").textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.dataset.pending = "true";
    row.innerHTML = `<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function formatNumber(n) {
    return typeof n === "number" ? n.toLocaleString() : n;
  }

  function renderAssistantMessage(row, data, cacheWasEnabled) {
    const bubble = row.querySelector(".bubble");
    bubble.textContent = data.response;

    const meta = document.createElement("div");
    meta.className = "meta";

    const badge = document.createElement("span");
    if (data.cache_hit) {
      badge.className = "badge hit";
      badge.textContent = "⚡ CACHE HIT";
    } else if (!cacheWasEnabled) {
      badge.className = "badge bypass";
      badge.textContent = "🚫 CACHE OFF";
    } else {
      badge.className = "badge miss";
      badge.textContent = "🧠 LLM CALL";
    }
    meta.appendChild(badge);

    if (data.cache_scope) {
      const scopeBadge = document.createElement("span");
      scopeBadge.className = `badge ${data.cache_scope}`;
      scopeBadge.textContent = data.cache_scope === "specific" ? "👤 SPECIFIC" : "🌐 GENERAL";
      meta.appendChild(scopeBadge);
    }

    const latency = document.createElement("span");
    latency.textContent = `${data.latency_ms.toFixed(1)} ms`;
    meta.appendChild(latency);

    const tokens = document.createElement("span");
    if (data.cache_hit) {
      tokens.textContent = `· ${formatNumber(data.tokens_saved)} tokens saved`;
    } else {
      tokens.textContent = `· ${formatNumber(data.prompt_tokens)} in / ${formatNumber(data.output_tokens)} out / ${formatNumber(data.total_tokens)} total tokens`;
    }
    meta.appendChild(tokens);

    row.appendChild(meta);
    row.dataset.pending = "false";
    scrollToBottom();
  }

  function renderErrorMessage(row, message) {
    const bubble = row.querySelector(".bubble");
    bubble.className = "bubble error";
    bubble.textContent = message;
    row.dataset.pending = "false";
    scrollToBottom();
  }

  async function sendQuestion(question) {
    addUserMessage(question);
    const pendingRow = addTypingIndicator();
    const useCache = cacheToggle.checked;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question,
          account_id: accountSelect.value,
          use_cache: useCache,
          session_id: sessionId,
        }),
      });

      if (!res.ok) {
        let detail = `Request failed (HTTP ${res.status})`;
        try {
          const errBody = await res.json();
          if (errBody && errBody.detail) detail = JSON.stringify(errBody.detail);
        } catch (_) {}
        renderErrorMessage(pendingRow, `⚠️ ${detail}`);
        return;
      }

      const data = await res.json();
      renderAssistantMessage(pendingRow, data, useCache);
    } catch (err) {
      renderErrorMessage(pendingRow, `⚠️ Could not reach the server: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    sendQuestion(question);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  input.focus();
</script>
</body>
</html>
